name: CI

# Everything here is free on a public repository: GitHub gives public repos
# unlimited standard-runner minutes. If this repo is ever made private, the
# Windows job bills at 2x the Linux rate against the 2,000 minute monthly
# allowance, and artifacts count against 500 MB of storage.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The development toolchain and the published package have different floors:
  # vitest needs Node 20, while the package itself only needs parseArgs and
  # fetch. Running the suite on an older Node would test the toolchain, not the
  # product, so the floor is verified separately by `runtime-floor` below.
  library:
    name: library · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
        os: [ubuntu-latest]
        include:
          # The CLI writes files, spawns itself and reads sockets; Windows has
          # already produced bugs the Linux runs did not (path handling, a libuv
          # assertion on exit), so the newest Node is exercised there too.
          - node: '24'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # `engines.node` is a promise to whoever installs the package. It is kept by
  # building on a current Node and then running the built artifact on the oldest
  # one claimed — which is what a user on that version actually gets.
  runtime-floor:
    name: runs on the oldest supported node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Switch to the floor declared in engines.node
        uses: actions/setup-node@v4
        with:
          node-version: '18.17'

      - name: The CLI runs
        run: |
          node --version
          node dist/cli.js --version
          node dist/cli.js test/fixtures/basic.xml
          node dist/cli.js test/fixtures/index.xml --offline

      - name: Both module systems load
        run: |
          node -e "const a=require('./dist/index.cjs'); if(!a.buildTree) throw new Error('cjs export missing')"
          node --input-type=module -e "import('./dist/index.js').then(m => { if (!m.buildTree) throw new Error('esm export missing') })"

  extension:
    name: vscode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # One install covers both: the extension is a workspace of the root.
      - run: npm ci
      - run: npm test -w sitemap-atlas-vscode
      - name: Package the extension
        run: npx --yes @vscode/vsce package --no-dependencies --out sitemap-atlas.vsix
        working-directory: vscode-extension
      - name: Fail if the notices are out of date
        # The file is regenerated by the build; a diff means a dependency
        # changed and the licence list was not refreshed.
        run: git diff --exit-code -- vscode-extension/THIRD-PARTY-NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: sitemap-atlas-vsix
          path: vscode-extension/sitemap-atlas.vsix
          retention-days: 7

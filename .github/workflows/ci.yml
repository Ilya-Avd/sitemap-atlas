name: CI

# Everything here is free on a public repository: GitHub gives public repos
# unlimited standard-runner minutes. If this repo is ever made private, the
# Windows job bills at 2x the Linux rate against the 2,000 minute monthly
# allowance, and artifacts count against 500 MB of storage.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: library · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['18.17', '20', '22', '24']
        os: [ubuntu-latest]
        include:
          # The CLI writes files, spawns itself and reads sockets; Windows has
          # already produced bugs the Linux runs did not (path handling, a libuv
          # assertion on exit), so the newest Node is exercised there too.
          - node: '24'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  extension:
    name: vscode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # One install covers both: the extension is a workspace of the root.
      - run: npm ci
      - run: npm test -w sitemap-atlas-vscode
      - name: Package the extension
        run: npx --yes @vscode/vsce package --no-dependencies --out sitemap-atlas.vsix
        working-directory: vscode-extension
      - name: Fail if the notices are out of date
        # The file is regenerated by the build; a diff means a dependency
        # changed and the licence list was not refreshed.
        run: git diff --exit-code -- vscode-extension/THIRD-PARTY-NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: sitemap-atlas-vsix
          path: vscode-extension/sitemap-atlas.vsix
          retention-days: 7
